name: Sincronizar Meta Ads

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar Meta Graph API
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.SECRET_META }}
          META_IG_USER_ID: "17841416711983429"
          META_AD_ACCOUNT_ID: "639101696622735"
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
        run: node scripts/sync-meta-insights.mjs

      - name: Publicar se houver alteração
        run: |
          git config user.name "NaCapital Automation"
          git config user.email "automation@nacapital.work"
          git add docs/meta-ads-ultimo-mes/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza dados do Meta Ads"
          git push
